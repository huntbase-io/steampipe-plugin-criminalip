name: Release

# Push a v* tag to build the plugin for linux/darwin x amd64/arm64 and attach
# the gzipped binaries and SHA256 checksums to a GitHub release. See RELEASING.md.

on:
  push:
    tags:
      - "v*"
  # Rebuild missing SQLite extension assets for an existing release. Assets
  # that are already attached are left as they are.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.x"
  GORELEASER_VERSION: "v2.18.2"

jobs:
  release:
    name: GoReleaser
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser builds the changelog from history
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true # use the newest patch, not the runner's cached one
          cache-dependency-path: go.sum

      - name: Test
        run: go test -count=1 ./...

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sqlite:
    # SQLite extension assets, as published by huntbase-io/steampipe-plugin-anthropic.
    # hb-backend's steampipe-util.sh downloads steampipe_sqlite_<name>.<arch>.tar.gz
    # from this release on platforms the huntbase-io/steampipe-sqlite release
    # doesn't cover (linux_amd64 comes from that fork's release instead).
    name: SQLite extension (${{ matrix.label }})
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: linux_amd64
          - runner: ubuntu-24.04-arm
            label: linux_arm64
          - runner: macos-latest
            label: darwin_arm64
          # Cross-compiled on Apple silicon: GitHub is retiring its Intel macOS
          # runners. Apple clang targets x86_64 with -arch.
          - runner: macos-latest
            label: darwin_amd64
            build_env: GOARCH=amd64 CGO_ENABLED=1 CC='clang -arch x86_64'
            cross: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write # upload release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum

      - name: Build SQLite extension
        env:
          SQLITE_BUILD_ENV: ${{ matrix.build_env }}
        run: make sqlite SQLITE_BUILD_ENV="$SQLITE_BUILD_ENV"

      - name: Check the architecture
        if: matrix.cross
        run: |
          file steampipe_sqlite_criminalip.so
          test "$(lipo -archs steampipe_sqlite_criminalip.so)" = x86_64

      - name: Check it loads
        if: ${{ !matrix.cross }}
        run: |
          python3 -I -c "
          import sqlite3
          c = sqlite3.connect(':memory:')
          if not hasattr(c, 'enable_load_extension'):
              print('this Python cannot load SQLite extensions; skipping'); raise SystemExit(0)
          c.enable_load_extension(True)
          # Full file name: without a suffix, macOS SQLite looks for .dylib.
          c.load_extension('./steampipe_sqlite_criminalip.so')
          n = c.execute(\"select count(*) from pragma_module_list where name like 'criminalip%'\").fetchone()[0]
          assert n > 0, 'no criminalip tables registered'
          print(n, 'tables')"

      - name: Package and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          ARCHIVE: steampipe_sqlite_criminalip.${{ matrix.label }}.tar.gz
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qxF "$ARCHIVE"; then
            echo "$ARCHIVE is already attached to $TAG; leaving it unchanged."
            exit 0
          fi
          tar -czf "$ARCHIVE" steampipe_sqlite_criminalip.so
          gh release upload "$TAG" "$ARCHIVE" -R "$GITHUB_REPOSITORY"

  sqlite-checksums:
    # SHA-256 of the SQLite archives, as their own file: GoReleaser's
    # SHA256SUMS covers only the plugin binaries and is never rewritten.
    name: SQLite extension checksums
    needs: sqlite
    if: ${{ !cancelled() && needs.sqlite.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload release assets
    steps:
      - name: Checksum and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          sums="steampipe_sqlite_criminalip_${TAG#v}_SHA256SUMS"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qxF "$sums"; then
            echo "$sums is already attached to $TAG; leaving it unchanged."
            exit 0
          fi
          mkdir dl && cd dl
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'steampipe_sqlite_criminalip.*.tar.gz'
          n=$(ls | wc -l)
          test "$n" -eq 4 || { echo "::error::expected 4 SQLite archives on $TAG, found $n"; exit 1; }
          sha256sum steampipe_sqlite_criminalip.*.tar.gz > "../$sums"
          cat "../$sums"
          gh release upload "$TAG" "../$sums" -R "$GITHUB_REPOSITORY"
